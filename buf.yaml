version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # The bidi streams (ProxySession, Session) deliberately use one frame type
    # for both directions, so request/response types are shared by design.
    - RPC_REQUEST_RESPONSE_UNIQUE
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
